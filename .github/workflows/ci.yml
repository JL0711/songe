name: CI

# Runs only before a release (release.yml calls it for v* tags) or by hand
# (Actions → CI → Run workflow). Everyday pushes are tested locally.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts .github/ci packaging/homebrew
      - run: uv run --no-sync pytest
      - run: uv build

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify Apple Silicon runner
        run: uv run --no-project python -c "import platform; assert platform.machine() == 'arm64'"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts .github/ci packaging/homebrew
      - run: uv run --no-sync pytest
      - run: uv build
      - run: uv run --no-sync songe --version
